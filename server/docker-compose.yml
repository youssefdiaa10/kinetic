services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-yosofalwakil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in server/.env}
      POSTGRES_DB: ${DB_NAME:-kinetic}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
